plugins {
    id 'java'
}

group = 'io.github.sodalisretro'
version = '0.1.0'

// ============================================================
// WTK, MicroEmulator & LWUIT paths
// ============================================================
ext {
    wtkHome = 'C:/WTK2.5.2'
    wtkJarDir = file("$wtkHome/lib")
    lwuitJar = file('lib/LWUIT_MIDP.jar')
    midpIoJar = file('lib/MIDP_IO.jar')
}

// All WTK lib jars for bootclasspath & preverify
def wtkJars() {
    fileTree(dir: wtkJarDir, include: '*.jar').collect { it.absolutePath }.join(File.pathSeparator)
}

def allClasspath = files(lwuitJar, midpIoJar, fileTree(wtkJarDir))

// ============================================================
// Compilation: target CLDC-1.1 / MIDP-2.0
// ============================================================
java {
    sourceCompatibility = JavaVersion.VERSION_1_3
    targetCompatibility = JavaVersion.VERSION_1_3
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs = [
        '-bootclasspath',
        wtkJars()
    ]
    classpath = allClasspath
    // Output raw classes to a separate dir (not the default)
    // so they never end up in the final jar
    destinationDir = file("${buildDir}/classes-raw")
}

// ============================================================
// Preverify — CLDC MANDATORY step
// ============================================================
def preverifiedDir = layout.buildDirectory.dir('preverified').get().asFile

tasks.register('preverify') {
    dependsOn classes
    description = 'Run WTK preverify on compiled classes (CLDC requirement)'

    doFirst {
        delete preverifiedDir
        preverifiedDir.mkdirs()
    }

    doLast {
        exec {
            workingDir = projectDir
            executable = "$wtkHome/bin/preverify.exe"
            args = [
                    '-classpath', [wtkJars(), compileJava.destinationDir.absolutePath, 'lib/LWUIT_MIDP.jar', 'lib/MIDP_IO.jar'].join(';'),
                    '-d',          preverifiedDir.absolutePath,
                    compileJava.destinationDir.absolutePath
            ]
        }
    }
}

// ============================================================
// Copy preverified classes into main output dir so the Jar
// task picks them up automatically (no duplicate issue)
// ============================================================
tasks.register('prepareJarClasses') {
    dependsOn preverify
    description = 'Copy preverified classes to main output directory'
    doLast {
        delete sourceSets.main.output.classesDirs.singleFile
        copy {
            from preverifiedDir
            into sourceSets.main.output.classesDirs.singleFile
        }
    }
}

jar {
    dependsOn prepareJarClasses
    description = 'Build MIDlet jar from preverified classes'

    manifest {
        attributes(
                'MIDlet-Name':          MIDletName,
                'MIDlet-Version':       MIDletVersion,
                'MIDlet-Vendor':        MIDletVendor,
                'MIDlet-1':             "${MIDletName}, ${icon}, ${mainClass}",
                'MicroEdition-Configuration': MicroEditionConfiguration,
                'MicroEdition-Profile': MicroEditionProfile,
                'MIDlet-Description':   MIDletDescription
        )
    }
}

// ============================================================
// Generate JAD descriptor (runs after jar)
// ============================================================
tasks.register('generateJad') {
    dependsOn jar
    doLast {
        def jarFile = jar.archiveFile.get().asFile
        def jadFile = new File(jarFile.parentFile, jarFile.name.replace('.jar', '.jad'))
        def jadProperties = [
                'MIDlet-Name'                : MIDletName,
                'MIDlet-Version'             : MIDletVersion,
                'MIDlet-Vendor'              : MIDletVendor,
                'MIDlet-1'                   : "${MIDletName}, ${icon}, ${mainClass}",
                'MicroEdition-Configuration' : MicroEditionConfiguration,
                'MicroEdition-Profile'       : MicroEditionProfile,
                'MIDlet-Description'         : MIDletDescription,
                'MIDlet-Jar-URL'             : jarFile.name,
                'MIDlet-Jar-Size'            : jarFile.length()
        ]
        jadFile.text = jadProperties.collect { key, value -> "${key}: ${value}" }.join('\n') + '\n'
        logger.lifecycle "JAD generated: ${jadFile.absolutePath}"
    }
}

// ============================================================
// Shortcut: build = jar + jad
// ============================================================
build.dependsOn generateJad
