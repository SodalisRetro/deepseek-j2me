plugins {
    id 'java'
}

group = 'io.github.sodalisretro'
version = MIDletVersion

// ============================================================
// WTK, MicroEmulator & LWUIT paths
// ============================================================
ext {
    wtkHome = 'C:/WTK2.5.2'
    wtkJarDir = file("$wtkHome/lib")
    meHome = file('microemulator-2.0.4')
    cldcJar = "$meHome/lib/cldcapi11.jar"
    midpJar = "$meHome/lib/midpapi20.jar"
    meJar   = "$meHome/microemulator.jar"
    lwuitJar = file('lib/LWUIT_MIDP.jar')
    midpIoJar = file('lib/MIDP_IO.jar')
}

// All WTK lib jars for bootclasspath & preverify
def wtkJars() {
    fileTree(dir: wtkJarDir, include: '*.jar').collect { it.absolutePath }.join(File.pathSeparator)
}

def allClasspath = files(cldcJar, midpJar, lwuitJar, midpIoJar, fileTree(wtkJarDir))

// ============================================================
// Compilation: target CLDC-1.1 / MIDP-2.0
// ============================================================
java {
    sourceCompatibility = JavaVersion.VERSION_1_3
    targetCompatibility = JavaVersion.VERSION_1_3
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs = [
        '-bootclasspath',
        wtkJars()
    ]
    classpath = allClasspath
    // Output raw classes to a separate dir (not the default)
    // so they never end up in the final jar
    destinationDir = file("${buildDir}/classes-raw")
}

// ============================================================
// Preverify — CLDC MANDATORY step
// ============================================================
def preverifiedDir = layout.buildDirectory.dir('preverified').get().asFile

tasks.register('preverify') {
    dependsOn classes
    description = 'Run WTK preverify on compiled classes (CLDC requirement)'

    doFirst {
        delete preverifiedDir
        preverifiedDir.mkdirs()
    }

    doLast {
        exec {
            workingDir = projectDir
            executable = "$wtkHome/bin/preverify.exe"
            args = [
                    '-classpath', [wtkJars(), compileJava.destinationDir.absolutePath, 'lib/LWUIT_MIDP.jar', 'lib/MIDP_IO.jar'].join(';'),
                    '-d',          preverifiedDir.absolutePath,
                    compileJava.destinationDir.absolutePath
            ]
        }
    }
}

// ============================================================
// Copy preverified classes into main output dir so the Jar
// task picks them up automatically (no duplicate issue)
// ============================================================
tasks.register('prepareJarClasses') {
    dependsOn preverify
    description = 'Copy preverified classes to main output directory'
    doLast {
        delete sourceSets.main.output.classesDirs.singleFile
        copy {
            from preverifiedDir
            into sourceSets.main.output.classesDirs.singleFile
        }
    }
}

// ============================================================
// Fat jar — preverified + embedded LWUIT/MIDP_IO (not shrunk)
// ============================================================
tasks.register('fatJar', Jar) {
    dependsOn prepareJarClasses
    description = 'Build fat jar with embedded LWUIT (not shrunk)'

    archiveClassifier = 'fat'

    from sourceSets.main.output.classesDirs
    from zipTree(lwuitJar)
    from zipTree(midpIoJar)
    eachFile { FileCopyDetails fcp ->
        if (fcp.path.startsWith('META-INF/') && fcp.path != 'META-INF/MANIFEST.MF') {
            fcp.exclude()
        }
    }

    manifest {
        attributes(
                'MIDlet-Name':          MIDletName,
                'MIDlet-Version':       MIDletVersion,
                'MIDlet-Vendor':        MIDletVendor,
                'MIDlet-1':             "${MIDletName}, ${icon}, ${mainClass}",
                'MicroEdition-Configuration': MicroEditionConfiguration,
                'MicroEdition-Profile': MicroEditionProfile,
                'MIDlet-Description':   MIDletDescription
        )
    }
}

// ============================================================
// ProGuard — shrink/obfuscate the fat jar for production.
// Output replaces the default jar (no classifier) so that
// `gradlew jar` gives the production-ready artifact.
// ============================================================
def proguardJar = file("${buildDir}/libs/${project.name}-${version}.jar")

tasks.register('proguard') {
    dependsOn fatJar
    description = 'Shrink jar with ProGuard (removes unused LWUIT classes)'

    doLast {
        def fat = fatJar.archiveFile.get().asFile

        delete proguardJar

        exec {
            executable = 'java'
            args = [
                    '-jar', "$wtkHome/lib/proguard-4.4.jar",
                    '-injars',  fat.absolutePath,
                    '-outjars', proguardJar.absolutePath,
                    '-libraryjars', "${wtkHome}/lib/cldcapi11.jar",
                    '-libraryjars', "${wtkHome}/lib/midpapi20.jar",
                    '-dontwarn',
                    '-ignorewarnings',
                    '-dontusemixedcaseclassnames',
                    '-dontpreverify',
                    '-dontoptimize',
                    '-keep', 'public class io.github.sodalisretro.deepseek.DeepSeekMIDlet',
                    '-keep', 'public class * extends javax.microedition.midlet.MIDlet',
                    '-keepclassmembers', 'public class * extends javax.microedition.midlet.MIDlet { *; }'
            ]
        }
    }
}

// Make `gradlew jar` produce the ProGuard-shrunk jar
jar {
    dependsOn proguard
    description = 'Build production jar (preverified + ProGuard-shrunk)'
    // Disable the built-in jar actions — output is created by ProGuard
    onlyIf { false }
}

// ============================================================
// Generate JAD descriptor (runs after proguard)
// ============================================================
tasks.register('generateJad') {
    dependsOn proguard
    doLast {
        def jarFile = proguardJar
        def jadFile = new File(jarFile.parentFile, jarFile.name.replace('.jar', '.jad'))
        def jadProperties = [
                'MIDlet-Name'                : MIDletName,
                'MIDlet-Version'             : MIDletVersion,
                'MIDlet-Vendor'              : MIDletVendor,
                'MIDlet-1'                   : "${MIDletName}, ${icon}, ${mainClass}",
                'MicroEdition-Configuration' : MicroEditionConfiguration,
                'MicroEdition-Profile'       : MicroEditionProfile,
                'MIDlet-Description'         : MIDletDescription,
                'MIDlet-Jar-URL'             : jarFile.name,
                'MIDlet-Jar-Size'            : jarFile.length()
        ]
        jadFile.text = jadProperties.collect { key, value -> "${key}: ${value}" }.join('\n') + '\n'
        logger.lifecycle "JAD generated: ${jadFile.absolutePath}"
    }
}

// ============================================================
// Run in MicroEmulator (preverified jar)
// ============================================================
tasks.register('runEmulator') {
    dependsOn proguard
    doLast {
        javaexec {
            mainClass = 'org.microemu.app.Main'
            classpath = files(
                    meJar,
                    "$meHome/devices/microemu-device-resizable.jar",
                    "$meHome/devices/microemu-device-default.jar",
                    cldcJar,
                    midpJar,
                    "$wtkHome/lib/mmapi.jar",
                    lwuitJar,
                    midpIoJar
            )
            jvmArgs '-Dsun.java2d.d3d=false'
            args = [proguardJar.absolutePath]
        }
    }
}

// ============================================================
// Raw jar from uncompiled classes (no preverify)
// ============================================================
tasks.register('jarRaw', Jar) {
    dependsOn classes
    from compileJava.destinationDir
    from sourceSets.main.resources
    from zipTree(lwuitJar)
    from zipTree(midpIoJar)
    eachFile { FileCopyDetails fcp ->
        if (fcp.path.startsWith('META-INF/') && fcp.path != 'META-INF/MANIFEST.MF') {
            fcp.exclude()
        }
    }
    archiveClassifier = 'raw'
    manifest {
        attributes(
                'MIDlet-Name':          MIDletName,
                'MIDlet-Version':       MIDletVersion,
                'MIDlet-Vendor':        MIDletVendor,
                'MIDlet-1':             "${MIDletName}, ${icon}, ${mainClass}",
                'MicroEdition-Configuration': MicroEditionConfiguration,
                'MicroEdition-Profile': MicroEditionProfile,
                'MIDlet-Description':   MIDletDescription
        )
    }
}

// ============================================================
// Run in MicroEmulator (raw classes, skip preverify)
// ============================================================
tasks.register('runEmulatorFast') {
    dependsOn jarRaw
    doLast {
        javaexec {
            mainClass = 'org.microemu.app.Main'
            classpath = files(
                    meJar,
                    "$meHome/devices/microemu-device-resizable.jar",
                    "$meHome/devices/microemu-device-default.jar",
                    cldcJar,
                    midpJar,
                    "$wtkHome/lib/mmapi.jar",
                    lwuitJar,
                    midpIoJar
            )
            jvmArgs '-Dsun.java2d.d3d=false'
            args = [tasks.jarRaw.archiveFile.get().asFile.absolutePath]
        }
    }
}

// ============================================================
// Shortcut: build = jar + jad
// ============================================================
build.dependsOn generateJad
